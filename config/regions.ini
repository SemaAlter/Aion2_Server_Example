# Sema Redirector region list.
# The client_key identifies the existing client-side region button. The
# Redirector routes its lobby connection; it does not rename client UI text.

[redirector]
default_target=127.0.0.1
default_target_port=13700

[region.sema-local-eu]
enabled=true
client_key=EU
display_name=Sema Local
official_host=193.202.112.93
official_port=13700

# Add another [region.<unique-id>] section only after its official lobby
# endpoint has been verified in a controlled capture. target_host and
# target_port may be set per region; otherwise the defaults above are used.
