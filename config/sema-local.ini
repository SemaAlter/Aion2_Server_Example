# Sema Local lobby entry
# Use a private ID. Official IDs are localized to official server names by the client.
# 1312 (0x0520): the world ID the bootstrap character, kill records and the tutorial-exit roster carry.
server_id=1312
name=Sema Local

# elyos or asmodians
faction=elyos

# Availability controls whether the client treats the server as online.
available=true

# Display badges. These are independent bit flags and may be combined.
new=true
recommended=true
character_creation_restricted=false

# Current server load shown by the green/orange/red congestion indicator.
load_percent=10
